[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faact"
version = "0.1.0"
description = "FAACT: Failure-Aware Action Chunk Transformer - risk-aware supervisory wrapper around π₀.5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "scikit-learn>=1.2",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
pi05 = ["lerobot"]  # Install from Research/lerobot: pip install -e ../Research/lerobot
aloha = ["gymnasium", "gym-aloha"]  # For real Aloha rollouts
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
collect-rollouts = "faact.scripts.collect_rollouts:main"
build-fact-dataset = "faact.scripts.build_fact_dataset:main"
train-fact = "faact.scripts.train_fact:main"
calibrate-fact = "faact.scripts.calibrate_fact:main"
eval-fact-offline = "faact.scripts.eval_fact_offline:main"
eval-fact-online = "faact.scripts.eval_fact_online:main"
run-wrapped-policy = "faact.scripts.run_wrapped_policy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faact*"]

[tool.ruff]
line-length = 100
target-version = "py310"
